<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:512px; height:512px; overflow:hidden; }
  .tile {
    position:relative; width:512px; height:512px;
    background:
      radial-gradient(120% 120% at 30% 12%, #1E2E4D 0%, #16233C 62%, #101A2E 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:"Noto Sans SC","Noto Sans",sans-serif;
  }
  .mark {
    font-weight:900; color:#FFFFFF;
    font-size:236px; line-height:1;
    letter-spacing:-0.035em;
    text-indent:-0.035em;      /* pull the trailing letter-space back for true centring */
    margin-top:-18px;
    font-feature-settings:"kern" 1;
  }
  .bar { display:flex; gap:15px; margin-top:32px; }
  .bar span { display:block; width:73px; height:20px; border-radius:3px; background:#B2431B; }
  .bar.solid span { width:249px; }
  .ring { box-shadow:inset 0 0 0 7px rgba(246,244,239,.16); }
</style></head>
<body><div class="tile ring">
  <div class="mark">WB</div>
  <div class="bar three"><span></span><span></span><span></span></div>
</div></body></html>
