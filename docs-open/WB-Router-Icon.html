<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:512px; height:512px; overflow:hidden; }
  .tile {
    position:relative; width:512px; height:512px;
    background:radial-gradient(120% 120% at 30% 12%, #1E2E4D 0%, #16233C 58%, #111C30 100%);
    box-shadow:inset 0 0 0 7px rgba(246,244,239,.16);
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Sans SC","Noto Sans",sans-serif; overflow:hidden;
  }
  .lockup { display:flex; flex-direction:column; align-items:center;
             transform:translate(2.5px, -22.75px); }
  .mark { font-weight:900; color:#FFFFFF; font-size:236px; line-height:1;
           letter-spacing:-0.035em; text-indent:-0.035em; }
  .bar { width:249px; height:24px; border-radius:3px; background:#C44A1C; margin-top:30px; }
</style></head>
<body><div class="tile"><div class="lockup">
  <div class="mark">WB</div><div class="bar"></div>
</div></div></body></html>
